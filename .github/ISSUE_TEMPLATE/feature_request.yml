name: Feature request
description: Suggest a small reviewer-contract or reproduction improvement
title: "[Feature]: "
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to add or improve?
      description: Keep it concrete and close to the repository's current scope.
      placeholder: Make the local reproduction path easier to verify from a fresh clone.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it help?
      description: Explain how this improves the demo, docs, or portfolio narrative.
      placeholder: It would reduce reviewer guesswork without changing the demo matrix.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope guardrails
      description: Call out anything this request should not turn into.
      placeholder: Keep it file-based; no new demos, hosted dashboard, or alert-routing work.
